name: Deploy Tteuium demo
on:
  push:
    branches: [feature/tteuium-dashboard]
    paths: ['product/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tteuium-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'Hyuk623/tteuium'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r product/requirements-dev.txt
      - run: mkdir -p build
      - run: python -m pytest product/tests -q --basetemp=build/pages-tests
      - run: python -m product.export_pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
